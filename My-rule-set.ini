[custom]

; =========================================================
; My-rule-set V2 —— 稳定优先版
; 目标：
; 1. ChatGPT / OpenAI 稳定
; 2. YouTube 网页 + 视频流稳定
; 3. 重启后不要默认落到某个故障转移组
; 4. 保留 Zashboard 自定义策略组
;
; 本版主动取消 ProxyLite.list：
; - 不再把未知的 IP / 境外 DNS 强制送入代理
; - 不再依赖 qichiyu.com / 1e100 等旧规则
;
; 本版主动取消多级 fallback 链：
; - 🚀 节点选择 默认先进入 ♻️ 自动选择
; - AI / YouTube 等功能组优先进入自动测速组
; =========================================================

; -------------------------
; 自定义规则集
; -------------------------
ruleset=🤖 AI,https://raw.githubusercontent.com/qiantang-ren/My-rule-set/refs/heads/main/AI.list
ruleset=📹 YouTube,https://raw.githubusercontent.com/qiantang-ren/My-rule-set/refs/heads/main/YouTube.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/qiantang-ren/My-rule-set/refs/heads/main/Direct.list

