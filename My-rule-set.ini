; =========================================================
; 策略组
; =========================================================

; 核心总入口：第一项固定为自动测速，不再以 fallback 为第一项
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇭🇰 香港自动`[]🇺🇲 美国节点`[]🌐 其他地区`[]🏡 家宽节点`[]🛩️ 高速节点`[]🐸 手动切换`[]DIRECT

; YouTube：默认全部自动，避免重启后掉进香港故转
custom_proxy_group=📹 YouTube`select`[]♻️ 自动选择`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇭🇰 香港自动`[]🇺🇲 美国节点`[]🛩️ 高速节点`[]🐸 手动切换`[]DIRECT

